name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JavaScript test dependencies
        run: npm ci --ignore-scripts
      - name: Check JavaScript and TypeScript
        run: |
          npm run check:assets
          npm run check:js
          npm run check:api
          npm run check:types
      - name: Run backend tests
        run: npm run test:server
      - name: Run JavaScript unit tests
        run: npm run test:js

  layout:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep the image version aligned with the Playwright npm dependency.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      BPM_LAYOUT_TEST_SHARD: ${{ matrix.shard }}/2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JavaScript test dependencies
        run: npm ci --ignore-scripts
      - name: Verify preinstalled browser version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          const installed = JSON.parse(readFileSync('node_modules/playwright/package.json', 'utf8'));
          assert.equal(image.driverVersion, installed.version, 'Update the CI browser image when Playwright changes');
          JS
      - name: Run layout tests
        run: npm run test:layout

  browser-security:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chromium
            suite: all
          - browser: firefox
            suite: all
          - browser: webkit
            suite: policy
          - browser: webkit
            suite: controls
    env:
      BPM_TEST_BROWSER: ${{ matrix.browser }}
      BPM_TEST_SUITE: ${{ matrix.suite }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install JavaScript test dependencies
        run: npm ci --ignore-scripts
      - name: Verify preinstalled browser version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const image = JSON.parse(readFileSync('/ms-playwright/.docker-info', 'utf8'));
          const installed = JSON.parse(readFileSync('node_modules/playwright/package.json', 'utf8'));
          assert.equal(image.driverVersion, installed.version, 'Update the CI browser image when Playwright changes');
          JS
      - name: Run browser security tests
        run: |
          case "$BPM_TEST_SUITE" in
            all) skip='^$' ;;
            policy) skip='protected viewing|optional outbound' ;;
            controls) skip='local assets' ;;
            *) echo "Unknown browser security suite: $BPM_TEST_SUITE"; exit 1 ;;
          esac
          node --test --test-name-pattern "^${BPM_TEST_BROWSER}:" --test-skip-pattern "$skip" tests/browser/security.test.js

  container:
    if: ${{ github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"
      - name: Validate container
        env:
          BITCOIN_RPC_USER: test
          BITCOIN_RPC_PASSWORD: test
        run: |
          docker compose config --quiet
          npm run test:compose
          docker build --build-arg BPM_BUILD_REVISION="${GITHUB_SHA}" --tag bitcoin-peer-map:test .
          npm run test:container

  # Keep the required check stable and reject failed, cancelled, or skipped work.
  test:
    if: ${{ always() && github.event.pull_request.draft == false }}
    needs: [checks, layout, browser-security, container]
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require every test job to succeed
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          LAYOUT_RESULT: ${{ needs.layout.result }}
          BROWSER_RESULT: ${{ needs.browser-security.result }}
          CONTAINER_RESULT: ${{ needs.container.result }}
        run: |
          for result in "$CHECKS_RESULT" "$LAYOUT_RESULT" "$BROWSER_RESULT" "$CONTAINER_RESULT"; do
            if [[ "$result" != "success" ]]; then
              echo "A required test job failed or did not complete: $result"
              exit 1
            fi
          done
